<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Compact Header -->
        <header>
            <div class="header-content">
                <h1>🧠 Quiz</h1>
                <div class="controls">
                    <button id="refresh-btn" class="btn-icon" title="Refresh">🔄</button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Question Section (left) -->
            <div class="question-section">
                <div id="current-question">
                    <div class="no-question">
                        <p>No active quiz question</p>
                        <p>Send any message in chat to start!</p>
                    </div>
                </div>
            </div>

            <!-- Sidebar (right) -->
            <div class="sidebar">
                <!-- Tab Navigation -->
                <div class="tab-nav">
                    <button id="leaderboard-tab" class="tab-btn" data-tab="leaderboard">Leaderboard</button>
                    <button id="rules-tab" class="tab-btn" data-tab="rules">Help</button>
                </div>

                <!-- Tab Content -->
                <div class="tab-content">
                    <div id="leaderboard-content" class="tab-panel">
                        <div id="leaderboard-list">
                            <div class="loading">Loading leaderboard...</div>
                        </div>
                    </div>

                    <div id="rules-content" class="tab-panel">
                        <ul>
                            <li>Quiz starts when you send any message</li>
                            <li>Type your answer in the chat</li>
                            <li>Get 1 point for each correct answer</li>
                            <li>New question appears after correct answer</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
